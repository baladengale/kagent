apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: kagent-api
  namespace: kagent
  labels:
    app.kubernetes.io/managed-by: kind-infra
  annotations:
    kind-infra.dev/host: kagent-api
spec:
  hostnames:
  - kagent-api.internal
  parentRefs:
  - group: gateway.networking.k8s.io
    kind: Gateway
    name: kind-infra
    namespace: agentgateway-system
  rules:
  - backendRefs:
    - group: ""
      kind: Service
      name: kagent-controller
      port: 8083
      weight: 1
    matches:
    - path:
        type: PathPrefix
        value: /
