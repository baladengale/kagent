# Expose the failover backend as an OpenAI-compatible endpoint on the kind-infra
# gateway. Clients send OpenAI Chat Completions format to /v1/chat/completions.
#
# IMPORTANT: agentgateway does NOT translate Anthropic /v1/messages inbound into
# OpenAI-compatible backends, so this is an OpenAI-compatible endpoint, NOT an
# Anthropic /v1/messages endpoint. See README.md for using it from ZCode / Claude Code.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llm-failover
  namespace: agentgateway-system
spec:
  parentRefs:
    - name: kind-infra
      namespace: agentgateway-system
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /v1/chat/completions
      backendRefs:
        - name: llm-failover
          namespace: agentgateway-system
          group: agentgateway.dev
          kind: AgentgatewayBackend
    - matches:
        - path:
            type: PathPrefix
            value: /v1/models
      backendRefs:
        - name: llm-failover
          namespace: agentgateway-system
          group: agentgateway.dev
          kind: AgentgatewayBackend
